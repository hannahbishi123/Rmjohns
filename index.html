<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary identity ──────────────────────────────────────────────── -->
    <title>RMJohn's Eatery | Online Ordering &amp; Eatery System</title>
    <meta name="description" content="Order online, earn rewards, and enjoy fresh food from RMJohn's Eatery. Online ordering, point of sale, and staff tools in one connected system." />

    <meta name="keywords" content="RMJohns, RMJohn's, eatery, online ordering, food, Philippines" />
    <meta name="author" content="RMJohn's Eatery" />
    <meta name="robots" content="index, follow" />

    <!-- ── PWA / installability ──────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#173b2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/svg+xml" href="/rmjohns.svg" />

    <!-- ── Open Graph (Facebook, Messenger, Viber previews) ─────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rmjohns-eateries.web.app/" />
    <meta property="og:site_name" content="RMJohn's Eatery" />
    <meta property="og:title" content="RMJohn's Eatery | Online Ordering &amp; Eatery System" />

    <meta property="og:image" content="https://rmjohns-eateries.web.app/rmjohns.svg" />
    <meta property="og:locale" content="en_PH" />

    <!-- ── Twitter / X card ──────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RMJohn's Eatery" />

    <meta name="twitter:image" content="https://rmjohns-eateries.web.app/rmjohns.svg" />

    <!-- ── Canonical URL ─────────────────────────────────────────────────── -->
    <link rel="canonical" href="https://rmjohns-eateries.web.app/" />

    <!-- ── Fonts ─────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
