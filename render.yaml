services:
  - type: web
    name: rmjohns-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://rmjohns-eateries.web.app,https://rmjohns-eateries.firebaseapp.com
      - key: FIREBASE_DATABASE_URL
        value: https://rmjohns-eateries-default-rtdb.firebaseio.com
